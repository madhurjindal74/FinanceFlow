<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow • Personal Finance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3 text-primary"
           href="/">
            💰 FinanceFlow
        </a>

        <div class="ms-auto">

        {% if session.get("user_id") %}

            <span class="me-4 fw-semibold">

                👋 {{ session["full_name"] }}

            </span>

            <a href="/logout"
               class="btn btn-outline-danger rounded-pill px-4">

                Logout

            </a>

        {% else %}

            <a href="/login"
               class="btn btn-outline-primary rounded-pill me-2 px-4">

                Login

            </a>

            <a href="/register"
               class="btn btn-primary rounded-pill px-4">

                Register

            </a>

        {% endif %}

        </div>

    </div>

</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% block content %}

{% endblock %}

<footer class="mt-5 py-4 text-center text-secondary">

    <hr>

    <p class="mb-0">

        Built with ❤️ using Flask, SQLite & Bootstrap

    </p>

    <small>

        © 2026 FinanceFlow

    </small>

</footer>

</body>
</html>
