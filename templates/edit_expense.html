{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Edit Expense</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Amount</label>
            <input
                type="number"
                step="0.01"
                class="form-control"
                name="amount"
                value="{{ expense[0] }}"
                required>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input
                type="text"
                class="form-control"
                name="category"
                value="{{ expense[1] }}"
                required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <input
                type="text"
                class="form-control"
                name="description"
                value="{{ expense[2] }}">
        </div>

        <div class="mb-3">
            <label>Date</label>
            <input
                type="date"
                class="form-control"
                name="date"
                value="{{ expense[3] }}"
                required>
        </div>

        <button class="btn btn-success">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
